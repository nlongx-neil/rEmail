[package]
name = "mail_sender"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lettre = { version = "0.11", features = ["smtp-transport", "builder", "rustls-tls"] }
anyhow = "1.0"
parking_lot = "0.12"
rfd = "0.14" 
chrono = "0.4"
uuid ={ version = "1.19.0", features = ["v4","serde"] }

# 仅 Windows 目标启用：把 assets/icon.ico 嵌入 exe 资源（其他平台不编译）
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = true
opt-level = "z"
strip = true
