<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2434"/>
      <stop offset="1" stop-color="#0A0E16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#13A98F"/>
      <stop offset="1" stop-color="#3BE3C0"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="190" ry="190" fill="url(#bg)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="182" ry="182"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="8"/>

  <!-- 信封主体 -->
  <rect x="232" y="336" width="560" height="352" rx="44" ry="44" fill="#EEF3FA"/>
  <path d="M232 380 L512 566 L792 380"
        fill="none" stroke="#B7C6DA" stroke-width="14" stroke-linecap="round"/>

  <!-- 拦截斜杠（深色描边做分离，避免与信封糊在一起） -->
  <line x1="560" y1="896" x2="896" y2="560" stroke="#0A0E16" stroke-width="150" stroke-linecap="round"/>
  <line x1="560" y1="896" x2="896" y2="560" stroke="url(#accent)" stroke-width="118" stroke-linecap="round"/>
</svg>
